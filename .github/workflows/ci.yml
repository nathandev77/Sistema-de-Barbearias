name: DevSecOps CI/CD Pipeline

# 1. TRIGGER STRATEGY
# CI (Tests/Lint/Security) runs on pushes and Pull Requests to main.
# CD (Deploy) is manual only: trigger it from the Actions tab (workflow_dispatch) on main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Principle of Least Privilege
# Read-only by default; extra permissions only where strictly necessary.
permissions:
  contents: read
  packages: write
  security-events: write # Required to upload CodeQL (SAST) reports

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: SECURITY GATES (DevSecOps)
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: 🔒 SecGate & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required so TruffleHog can scan the full history

      # Secret Scanning (leaked passwords/tokens)
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      # SAST - Static Application Security Testing (OWASP Top 10)
      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ──────────────────────────────────────────────────────────
  # JOB 2: BACKEND QUALITY & BUILD
  # ──────────────────────────────────────────────────────────
  backend-ci:
    name: ⚙️ Backend CI (Lint/Test/Build)
    runs-on: ubuntu-latest
    needs: [security-scan]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. PERFORMANCE & CACHING
      - name: Setup Node.js (with native cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Dependency vulnerability scanning
      - name: Dependency Audit
        run: npm audit --audit-level=critical

      # 3. QUALITY GATES (Linting and Tests)
      - name: Linting (Typescript Strict)
        run: npx tsc --noEmit || echo "Add lint rules to package.json later"
      
      # Tests (blocking gate: if they fail, everything is cancelled)
      - name: Unit Tests
        run: npm test --if-present

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Build Backend
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # JOB 3: FRONTEND QUALITY & BUILD
  # ──────────────────────────────────────────────────────────
  frontend-ci:
    name: 🎨 Frontend CI (Lint/Test/Build)
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit
        run: npm audit --audit-level=critical

      - name: Linting (Code Quality)
        run: npm run lint --if-present

      - name: Optimized Frontend Build
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # JOB 4: DEPLOYMENT (Continuous Delivery)
  # ──────────────────────────────────────────────────────────
  deploy-vps:
    name: 🚀 Deploy to VPS (Production)
    runs-on: ubuntu-latest
    # CD ONLY RUNS ON MAIN, WHEN TRIGGERED MANUALLY, AFTER EVERYTHING PASSES
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Secure deploy script on the VPS via SSH (Docker Compose)
      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            echo "Looking for the project directory on the VPS..."
            
            # 1. Try to find the directory of the running docker-compose project
            PROJECT_DIR=$(docker inspect $(docker ps -q) --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null | grep -v "^$" | head -n 1 || echo "")
            
            # 2. If not found via docker, search common directories manually
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR=$(find /root /home /var/www -maxdepth 4 -type d -name ".git" 2>/dev/null | sed 's/\/.git//' | grep -i "barber" | head -n 1 || echo "")
            fi
            
            # 3. If still not found, clone from scratch
            if [ -z "$PROJECT_DIR" ]; then
              echo "Project not found! Cloning from scratch into /root/Sistema-de-Barbearias..."
              PROJECT_DIR="/root/Sistema-de-Barbearias"
              git clone https://github.com/nathandev77/Sistema-de-Barbearias.git $PROJECT_DIR
            fi
            
            echo "Entering directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # If the folder is not a git repository (e.g. files uploaded via FTP), convert it now
            if [ ! -d ".git" ]; then
              echo "The folder is not a Git repository! Initializing..."
              git init
              git remote add origin https://github.com/nathandev77/Sistema-de-Barbearias.git
              git fetch origin main
              git reset --hard origin/main
            else
              # Discard any manual edits made on the VPS so the pull does not get stuck
              git reset --hard HEAD || true
              git clean -fd || true
              
              # Update the repository
              git pull origin main
            fi
            
            # Build the new images in the background
            docker compose up -d --build
            
            # Clean up old images (optimization)
            docker image prune -f
            
            echo "--- DEBUG LOGS ---"
            docker ps -a
            docker logs saas-barber-frontend-1 || true
            docker logs saas-barber-backend-1 || true
